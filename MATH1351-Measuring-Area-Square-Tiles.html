      function render(){const selected=Math.round(Number(get('area-size').value)/33);const s=sizes[selected];get('area-size').setAttribute('aria-valuetext',s+' cm tiles, '+([1120,630,280,70][selected])+' tiles');for(const id of ['area-tile-pattern','area-tile-image']){get(id).setAttribute('width',s);get(id).setAttribute('height',s);}let count=0;const layer=get('area-grid');layer.replaceChildren();const fragment=document.createDocumentFragment();for(let y=30;y<570;y+=s)for(let x=80;x<680;x+=s){if(x>=440&&y<330)continue;const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x,y,width:s,height:s,fill:designVisible?'url(#area-tile-pattern)':'var(--orange)','fill-opacity':designVisible?'1':(gridVisible?(((x-80)/s+(y-30)/s)%2?'.09':'.02'):'0'),stroke:'currentColor','stroke-opacity':gridVisible?'.65':'0','stroke-width':'.8'}))r.setAttribute(k,v);fragment.appendChild(r);count++;}layer.appendChild(fragment);get('area-count').textContent=count.toLocaleString();get('area-top').textContent=get('area-right').textContent=s+' cm';get('area-sample').style.display=visible?'':'none';get('area-lengths').style.display=visible?'':'none';for(const [id,length] of Object.entries({'length-top':360,'length-inner-vertical':300,'length-inner-horizontal':240,'length-right':240,'length-bottom':600,'length-left':540})){const label=get(id);label.replaceChildren();[(length/s)+' sides of tiles','× '+s+' cm each side','= '+length+' cm'].forEach((line,index)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','tspan');t.setAttribute('x',label.getAttribute('x'));t.setAttribute('dy',index===0?'0':'22');t.textContent=line;label.appendChild(t);});}}
      get('area-grid-toggle').addEventListener('click',()=>{gridVisible=!gridVisible;get('area-grid-toggle').textContent=gridVisible?'Hide grid':'Show grid';get('area-grid-toggle').setAttribute('aria-pressed',String(gridVisible));render();});get('area-design').addEventListener('click',()=>{designVisible=!designVisible;get('area-design').textContent=designVisible?'Hide tile design':'Show tile design';get('area-design').setAttribute('aria-pressed',String(designVisible));render();});get('area-size').addEventListener('input',render);get('area-measure').addEventListener('click',()=>{visible=!visible;get('area-measure').textContent=visible?'Hide measurements':'Show measurements';get('area-measure').setAttribute('aria-pressed',String(visible));render();});get('area-reset').addEventListener('click',()=>{get('area-size').value=99;gridVisible=false;get('area-grid-toggle').textContent='Show grid';get('area-grid-toggle').setAttribute('aria-pressed','false');designVisible=false;get('area-design').textContent='Show tile design';get('area-design').setAttribute('aria-pressed','false');visible=false;get('area-measure').textContent='Show measurements';get('area-measure').setAttribute('aria-pressed','false');render();});render();
    })();
  </script>
